name = "larp-bot-telegram-ingress"
main = "src/index.ts"
compatibility_date = "2026-08-20"
workers_dev = true

[secrets]
required = [
  "TG_WEBHOOK_SECRET",
  "VK_CALLBACK_SECRET",
  "VK_CONFIRMATION_STRING",
  "VK_GROUP_ID",
  "CF_TO_YANDEX_HMAC_SECRET",
  "CF_TO_AWS_HMAC_SECRET"
]

[vars]
BACKEND_INLINE_CUTOFF_MS = "1500"
INGRESS_HARD_DEADLINE_MS = "2500"
MAX_BODY_BYTES = "262144"

[[ratelimits]]
name = "TG_USER_RATE_LIMITER"
namespace_id = "731001"
simple = { limit = 30, period = 60 }

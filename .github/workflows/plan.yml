name: Production plan

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  plan:
    if: github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    environment: production-plan
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.TF_STATE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_SECRET_ACCESS_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_yandex_cloud_id: ${{ vars.YC_CLOUD_ID }}
      TF_VAR_yandex_folder_id: ${{ vars.YC_FOLDER_ID }}
      TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      TF_VAR_cloudflare_workers_subdomain: ${{ vars.CLOUDFLARE_WORKERS_SUBDOMAIN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.9"
      - name: Exchange GitHub OIDC token for Yandex IAM token
        env:
          YC_WIF_AUDIENCE: ${{ vars.YC_WIF_AUDIENCE }}
          YC_DEPLOY_SERVICE_ACCOUNT_ID: ${{ vars.YC_DEPLOY_SERVICE_ACCOUNT_ID }}
        run: |
          oidc_token="$(curl --fail --silent --show-error -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${YC_WIF_AUDIENCE}" | jq -r .value)"
          yc_token="$(curl --fail --silent --show-error https://auth.yandex.cloud/oauth/token \
            --data-urlencode 'grant_type=urn:ietf:params:oauth:grant-type:token-exchange' \
            --data-urlencode 'requested_token_type=urn:ietf:params:oauth:token-type:access_token' \
            --data-urlencode "audience=${YC_DEPLOY_SERVICE_ACCOUNT_ID}" \
            --data-urlencode "subject_token=${oidc_token}" \
            --data-urlencode 'subject_token_type=urn:ietf:params:oauth:token-type:id_token' | jq -r .access_token)"
          echo "::add-mask::${yc_token}"
          echo "YC_TOKEN=${yc_token}" >>"${GITHUB_ENV}"
      - run: python -m pip install --upgrade pip==26.2.1
      - run: bash scripts/build_function.sh
      - run: npm ci && npm run build
        working-directory: cloudflare/telegram-ingress
      - run: npm ci && npm run build
        working-directory: cloudflare/telegram-egress
      - name: Terraform init
        working-directory: infra/terraform
        run: terraform init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" -backend-config="key=larp-bot/production.tfstate"
      - name: Terraform plan
        working-directory: infra/terraform
        run: terraform plan -input=false -lock-timeout=5m

name: Production plan

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  plan:
    if: github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    environment: production-plan
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.TF_STATE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_SECRET_ACCESS_KEY }}
      YC_STORAGE_ACCESS_KEY: ${{ secrets.TF_STATE_ACCESS_KEY_ID }}
      YC_STORAGE_SECRET_KEY: ${{ secrets.TF_STATE_SECRET_ACCESS_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_yandex_cloud_id: ${{ vars.YC_CLOUD_ID }}
      TF_VAR_yandex_folder_id: ${{ vars.YC_FOLDER_ID }}
      TF_VAR_function_package_bucket: ${{ vars.TF_STATE_BUCKET }}
      TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      TF_VAR_cloudflare_workers_subdomain: ${{ vars.CLOUDFLARE_WORKERS_SUBDOMAIN }}
      TF_VAR_cloudflare_active_backend: ${{ vars.ACTIVE_BACKEND }}
      TF_VAR_aws_backend_url: ${{ vars.AWS_BACKEND_URL }}
      TF_VAR_yandex_gateway_enabled: ${{ vars.YANDEX_GATEWAY_ENABLED || 'true' }}
      TF_VAR_yandex_background_enabled: ${{ vars.YANDEX_BACKGROUND_ENABLED || 'true' }}
      TF_VAR_yandex_notifier_enabled: ${{ vars.YANDEX_NOTIFIER_ENABLED || 'true' }}
      TF_VAR_ydb_rehearsal_enabled: ${{ vars.YDB_REHEARSAL_ENABLED || 'false' }}
      TF_VAR_google_folder_id: ${{ vars.GOOGLE_FOLDER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.9"
          cache-dependency-path: |
            functions/disk_uploader/go.mod
            functions/registration_notifier/go.mod
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.9"
      - name: Exchange GitHub OIDC token for Yandex IAM token
        env:
          YC_WIF_AUDIENCE: ${{ vars.YC_WIF_AUDIENCE }}
          YC_DEPLOY_SERVICE_ACCOUNT_ID: ${{ vars.YC_DEPLOY_SERVICE_ACCOUNT_ID }}
        run: bash scripts/exchange_yandex_oidc_token.sh
      - run: python -m pip install --upgrade pip==26.2.1
      - run: bash scripts/build_function.sh
      - run: bash scripts/build_disk_uploader.sh
      - run: bash scripts/build_registration_notifier.sh
      - run: npm ci && npm run build
        working-directory: cloudflare/telegram-ingress
      - run: npm ci && npm run build
        working-directory: cloudflare/telegram-egress
      - name: Terraform init
        working-directory: infra/terraform
        run: terraform init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" -backend-config="key=larp-bot/production.tfstate"
      - name: Terraform plan
        working-directory: infra/terraform
        run: terraform plan -input=false -lock-timeout=5m

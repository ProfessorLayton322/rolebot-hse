name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  go-uploader:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.9"
          cache-dependency-path: |
            functions/disk_uploader/go.mod
            functions/disk_uploader/aws.go.mod
      - working-directory: functions/disk_uploader
        run: go test ./...
      - working-directory: functions/disk_uploader
        run: go test -modfile=aws.go.mod -mod=readonly -tags aws ./...
      - working-directory: functions/disk_uploader
        run: go vet ./...
      - working-directory: functions/disk_uploader
        run: go vet -modfile=aws.go.mod -mod=readonly -tags aws ./...

  go-registration-notifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.9"
          cache-dependency-path: |
            functions/registration_notifier/go.mod
            functions/registration_notifier/aws.go.mod
      - working-directory: functions/registration_notifier
        run: go test ./...
      - working-directory: functions/registration_notifier
        run: go test -modfile=aws.go.mod -mod=readonly -tags aws ./...
      - working-directory: functions/registration_notifier
        run: go vet ./...
      - working-directory: functions/registration_notifier
        run: go vet -modfile=aws.go.mod -mod=readonly -tags aws ./...

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip==26.2.1
      - run: python -m pip install -e '.[dev]'
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy
      - run: pytest
      - run: pip-audit --strict --requirement requirements.txt
      - run: python scripts/check_storage_constraint.py
      - run: bash scripts/check_telegram_isolation.sh

  workers:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        worker: [telegram-ingress, telegram-egress]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cloudflare/${{ matrix.worker }}/package-lock.json
      - working-directory: cloudflare/${{ matrix.worker }}
        run: npm ci
      - working-directory: cloudflare/${{ matrix.worker }}
        run: npm run typecheck
      - working-directory: cloudflare/${{ matrix.worker }}
        run: npm test
      - working-directory: cloudflare/${{ matrix.worker }}
        run: npm run build

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.9"
          cache-dependency-path: |
            functions/disk_uploader/go.mod
            functions/registration_notifier/go.mod
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.9"
      - run: python -m pip install --upgrade pip==26.2.1
      - run: bash scripts/build_function.sh
      - run: bash scripts/build_disk_uploader.sh
      - run: bash scripts/build_registration_notifier.sh
      - run: bash scripts/build_aws_standby_packages.sh
      - run: npm ci && npm run build
        working-directory: cloudflare/telegram-ingress
      - run: npm ci && npm run build
        working-directory: cloudflare/telegram-egress
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
        working-directory: infra/terraform
      - run: terraform validate
        working-directory: infra/terraform
      - run: terraform init -backend=false
        working-directory: infra/aws-bootstrap
      - run: terraform validate
        working-directory: infra/aws-bootstrap
      - run: terraform init -backend=false
        working-directory: infra/aws/application
      - run: terraform validate
        working-directory: infra/aws/application
      - run: terraform test
        working-directory: infra/aws/application
      - run: python scripts/check_storage_constraint.py

  secrets-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

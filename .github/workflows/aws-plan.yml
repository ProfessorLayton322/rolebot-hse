name: AWS production plan

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  plan:
    if: github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    environment: production-plan
    env:
      TF_VAR_cloudflare_workers_subdomain: ${{ vars.CLOUDFLARE_WORKERS_SUBDOMAIN }}
      TF_VAR_google_folder_id: ${{ vars.GOOGLE_FOLDER_ID }}
      TF_VAR_google_apps_script_url: ${{ vars.GOOGLE_APPS_SCRIPT_URL }}
      TF_VAR_ntfy_topic: ${{ vars.NTFY_TOPIC }}
      TF_VAR_tg_admin_ids: ${{ vars.TG_ADMIN_IDS }}
      TF_VAR_vk_admin_ids: ${{ vars.VK_ADMIN_IDS }}
      TF_VAR_tg_gamemaster_ids: ${{ vars.TG_GAMEMASTER_IDS }}
      TF_VAR_vk_gamemaster_ids: ${{ vars.VK_GAMEMASTER_IDS }}
      TF_VAR_application_mode: ${{ vars.AWS_APPLICATION_MODE || 'standby' }}
      TF_VAR_mutations_enabled: ${{ vars.AWS_MUTATIONS_ENABLED || 'false' }}
      TF_VAR_sqs_event_mapping_enabled: ${{ vars.AWS_SQS_EVENT_MAPPING_ENABLED || 'false' }}
      TF_VAR_scheduler_enabled: ${{ vars.AWS_SCHEDULER_ENABLED || 'false' }}
      TF_VAR_rehearsal_tables_enabled: ${{ vars.AWS_REHEARSAL_TABLES_ENABLED || 'false' }}
      TF_VAR_runtime_table_target: ${{ vars.AWS_RUNTIME_TABLE_TARGET || 'production' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.9"
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: "1.15.9"
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Verify fixed AWS deployment identity
        run: |
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          test "${account_id}" = "${{ vars.AWS_ACCOUNT_ID }}"
      - name: Build gated AWS application packages
        run: bash scripts/build_aws_application_packages.sh
      - name: Terraform init
        working-directory: infra/aws/application
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.AWS_TF_STATE_BUCKET }}" \
            -backend-config="key=${{ vars.AWS_TF_STATE_KEY }}" \
            -backend-config="region=${{ vars.AWS_REGION }}"
      - name: Terraform plan
        working-directory: infra/aws/application
        run: terraform plan -input=false -lock-timeout=5m

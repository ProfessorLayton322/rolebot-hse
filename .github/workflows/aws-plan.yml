name: AWS production plan

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  plan:
    if: github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    environment: production-plan
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: "1.15.9"
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Verify fixed AWS deployment identity
        run: |
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          test "${account_id}" = "${{ vars.AWS_ACCOUNT_ID }}"
      - name: Build inert standby packages
        run: bash scripts/build_aws_standby_packages.sh
      - name: Terraform init
        working-directory: infra/aws/application
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.AWS_TF_STATE_BUCKET }}" \
            -backend-config="key=${{ vars.AWS_TF_STATE_KEY }}" \
            -backend-config="region=${{ vars.AWS_REGION }}"
      - name: Terraform plan
        working-directory: infra/aws/application
        run: terraform plan -input=false -lock-timeout=5m

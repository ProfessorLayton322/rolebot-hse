name: AWS application deploy

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type APPLY_AWS_CONTROLS to apply the repository runtime controls
        required: true
        type: string
      billing_guardrails_confirmed:
        description: Payer-account budget and billing alerts were verified
        required: true
        default: false
        type: boolean
      run_rehearsal_smoke:
        description: Exercise signed HTTP, egress, scheduler target, and upload path against rehearsal tables
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-production-terraform
  cancel-in-progress: false

jobs:
  deploy:
    if: inputs.confirmation == 'APPLY_AWS_CONTROLS' && inputs.billing_guardrails_confirmed
    runs-on: ubuntu-latest
    environment: production
    env:
      TF_VAR_cloudflare_workers_subdomain: ${{ vars.CLOUDFLARE_WORKERS_SUBDOMAIN }}
      TF_VAR_google_folder_id: ${{ vars.GOOGLE_FOLDER_ID }}
      TF_VAR_google_apps_script_url: ${{ vars.GOOGLE_APPS_SCRIPT_URL }}
      TF_VAR_ntfy_topic: ${{ vars.NTFY_TOPIC }}
      TF_VAR_tg_admin_ids: ${{ vars.TG_ADMIN_IDS }}
      TF_VAR_vk_admin_ids: ${{ vars.VK_ADMIN_IDS }}
      TF_VAR_tg_gamemaster_ids: ${{ vars.TG_GAMEMASTER_IDS }}
      TF_VAR_vk_gamemaster_ids: ${{ vars.VK_GAMEMASTER_IDS }}
      TF_VAR_application_mode: ${{ vars.AWS_APPLICATION_MODE || 'standby' }}
      TF_VAR_mutations_enabled: ${{ vars.AWS_MUTATIONS_ENABLED || 'false' }}
      TF_VAR_sqs_event_mapping_enabled: ${{ vars.AWS_SQS_EVENT_MAPPING_ENABLED || 'false' }}
      TF_VAR_scheduler_enabled: ${{ vars.AWS_SCHEDULER_ENABLED || 'false' }}
      TF_VAR_rehearsal_tables_enabled: ${{ vars.AWS_REHEARSAL_TABLES_ENABLED || 'false' }}
      TF_VAR_runtime_table_target: ${{ vars.AWS_RUNTIME_TABLE_TARGET || 'production' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.9"
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: "1.15.9"
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Verify fixed AWS deployment identity
        run: |
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          test "${account_id}" = "${{ vars.AWS_ACCOUNT_ID }}"
      - name: Build gated AWS application packages
        run: bash scripts/build_aws_application_packages.sh
      - name: Validate signed Google Drive gateway
        env:
          GOOGLE_FOLDER_ID: ${{ vars.GOOGLE_FOLDER_ID }}
          GOOGLE_APPS_SCRIPT_URL: ${{ vars.GOOGLE_APPS_SCRIPT_URL }}
          GOOGLE_APPS_SCRIPT_HMAC_SECRET: ${{ secrets.GOOGLE_APPS_SCRIPT_HMAC_SECRET }}
        run: |
          python3 integrations/google-drive-apps-script/check_endpoint.py \
            "${GOOGLE_APPS_SCRIPT_URL}" \
            --expected-folder-id "${GOOGLE_FOLDER_ID}"
      - name: Apply AWS application stack and runtime controls
        working-directory: infra/aws/application
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.AWS_TF_STATE_BUCKET }}" \
            -backend-config="key=${{ vars.AWS_TF_STATE_KEY }}" \
            -backend-config="region=${{ vars.AWS_REGION }}"
          terraform plan -input=false -lock-timeout=5m -out=aws-production.tfplan
          terraform apply -input=false -lock-timeout=5m aws-production.tfplan
      - name: Populate Standard SecureString parameters
        working-directory: infra/aws/application
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_WEBHOOK_SECRET: ${{ secrets.TG_WEBHOOK_SECRET }}
          VK_ACCESS_TOKEN: ${{ secrets.VK_ACCESS_TOKEN }}
          VK_CALLBACK_SECRET: ${{ secrets.VK_CALLBACK_SECRET }}
          VK_CONFIRMATION_STRING: ${{ secrets.VK_CONFIRMATION_STRING }}
          VK_GROUP_ID: ${{ secrets.VK_GROUP_ID }}
          YANDEX_DISK_TOKEN: ${{ secrets.YANDEX_DISK_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_APPS_SCRIPT_HMAC_SECRET: ${{ secrets.GOOGLE_APPS_SCRIPT_HMAC_SECRET }}
          PARTICIPANT_KEY_HMAC_SECRET: ${{ secrets.PARTICIPANT_KEY_HMAC_SECRET }}
          CF_TO_AWS_HMAC_SECRET: ${{ secrets.CF_TO_AWS_HMAC_SECRET }}
          AWS_TO_CF_EGRESS_HMAC_SECRET: ${{ secrets.AWS_TO_CF_EGRESS_HMAC_SECRET }}
        run: |
          set +x
          parameter_names_json="$(terraform output -json runtime_parameter_names)"
          put_secret() {
            parameter_key="$1"
            parameter_value="$2"
            parameter_name="$(jq -er --arg key "${parameter_key}" '.[$key]' <<<"${parameter_names_json}")"
            byte_count="$(LC_ALL=C printf '%s' "${parameter_value}" | wc -c)"
            if [[ "${byte_count}" -lt 1 || "${byte_count}" -gt 4096 ]]; then
              echo "${parameter_name} must contain between 1 and 4096 bytes" >&2
              return 1
            fi
            aws ssm put-parameter \
              --name "${parameter_name}" \
              --type SecureString \
              --tier Standard \
              --value "${parameter_value}" \
              --overwrite >/dev/null
          }

          put_secret tg_bot_token "${TG_BOT_TOKEN}"
          put_secret tg_webhook_secret "${TG_WEBHOOK_SECRET}"
          put_secret vk_access_token "${VK_ACCESS_TOKEN}"
          put_secret vk_callback_secret "${VK_CALLBACK_SECRET}"
          put_secret vk_confirmation_string "${VK_CONFIRMATION_STRING}"
          put_secret vk_group_id "${VK_GROUP_ID}"
          put_secret yandex_disk_token "${YANDEX_DISK_TOKEN}"
          put_secret google_service_account_json "${GOOGLE_SERVICE_ACCOUNT_JSON}"
          put_secret google_apps_script_hmac_secret "${GOOGLE_APPS_SCRIPT_HMAC_SECRET}"
          put_secret participant_key_hmac_secret "${PARTICIPANT_KEY_HMAC_SECRET}"
          put_secret cloudflare_ingress_hmac_secret "${CF_TO_AWS_HMAC_SECRET}"
          put_secret cloudflare_egress_hmac_secret "${AWS_TO_CF_EGRESS_HMAC_SECRET}"
      - name: Create and verify the dual-Drive database snapshot
        working-directory: infra/aws/application
        run: |
          function_name="$(terraform output -raw database_snapshot_function_name)"
          invocation="$(aws lambda invoke \
            --function-name "${function_name}" \
            --cli-binary-format raw-in-base64-out \
            --payload '{"source":"deployment"}' \
            /tmp/database-snapshot-result.json)"
          test "$(jq -r '.FunctionError // empty' <<<"${invocation}")" = ""
          jq -e '
            (.exported_at | endswith("+03:00")) and
            (.payload_sha256 | test("^[0-9a-f]{64}$")) and
            (.google_drive_url | startswith("https://")) and
            (.yandex_disk_url | startswith("https://"))
          ' /tmp/database-snapshot-result.json >/dev/null
      - name: Confirm reversible runtime controls
        working-directory: infra/aws/application
        run: |
          controls="$(terraform output -json standby_controls)"
          test "$(jq -r .gateway_auth_type <<<"${controls}")" = "NONE"
          test "$(jq -r .application_mode <<<"${controls}")" = "${TF_VAR_application_mode}"
          test "$(jq -r .mutation_enabled <<<"${controls}")" = "${TF_VAR_mutations_enabled}"
          test "$(jq -r .runtime_table_target <<<"${controls}")" = "${TF_VAR_runtime_table_target}"
          test "$(jq -r .rehearsal_tables <<<"${controls}")" = "${TF_VAR_rehearsal_tables_enabled}"
          test "$(jq -r .sqs_event_mapping_state <<<"${controls}")" = "${TF_VAR_sqs_event_mapping_enabled}"
          if test "${TF_VAR_scheduler_enabled}" = "true"; then
            test "$(jq -r .scheduler_state <<<"${controls}")" = "ENABLED"
          else
            test "$(jq -r .scheduler_state <<<"${controls}")" = "DISABLED"
          fi
      - name: Exercise standby AWS integrations with rehearsal data
        if: inputs.run_rehearsal_smoke
        working-directory: infra/aws/application
        env:
          CF_TO_AWS_HMAC_SECRET: ${{ secrets.CF_TO_AWS_HMAC_SECRET }}
          AWS_TO_CF_EGRESS_HMAC_SECRET: ${{ secrets.AWS_TO_CF_EGRESS_HMAC_SECRET }}
          VK_CALLBACK_SECRET: ${{ secrets.VK_CALLBACK_SECRET }}
          VK_CONFIRMATION_STRING: ${{ secrets.VK_CONFIRMATION_STRING }}
          VK_GROUP_ID: ${{ secrets.VK_GROUP_ID }}
          YANDEX_DISK_TOKEN: ${{ secrets.YANDEX_DISK_TOKEN }}
          TG_ADMIN_IDS: ${{ vars.TG_ADMIN_IDS }}
        run: |
          test "${TF_VAR_application_mode}" = "active"
          test "${TF_VAR_mutations_enabled}" = "true"
          test "${TF_VAR_runtime_table_target}" = "rehearsal"
          test "${TF_VAR_rehearsal_tables_enabled}" = "true"
          export AWS_GATEWAY_URL="$(terraform output -raw standby_gateway_url)"
          export AWS_STORAGE_BUCKET="$(terraform output -raw application_bucket)"
          export TELEGRAM_EGRESS_URL="$(terraform output -raw telegram_egress_url)"
          python ../../../scripts/smoke_aws_rehearsal.py
